<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Author panorama</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a,button,summary,select,label[for],[role="tab"],input[type="checkbox"],input[type="radio"]{cursor:pointer}button:disabled{cursor:default}
:root{color-scheme:dark}
.edge .bar{opacity:0;transition:opacity 150ms ease}
.edge:hover .bar,.edge:focus-visible .bar{opacity:1}
.edge:focus-visible{outline:none}
.search{border-bottom:1px solid #9D9D9D}
.search:focus-within{border-bottom:2px solid #D4D4D4;margin-bottom:-1px}
.search input{outline:none}
.search input::placeholder{color:#9D9D9D}
.search input::-webkit-search-cancel-button{filter:invert(0.8)}
@media (prefers-reduced-motion: reduce){.slide{transition:none !important}}
</style>
</helmet>
<div style="width: 1440px; height: 1620px; box-sizing: border-box; padding: 40px 80px; background: #141414; color: #D4D4D4; font-family: 'Segoe UI', 'Selawik', sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 16px">
<span style="color: #9D9D9D">the author hub, with the window over it</span>
<div style="position: relative; width: 1280px; height: 343px; overflow: hidden; background: #1E1E1E">
<div style="position: absolute; left: 0; top: 0; width: 5600px; height: 1500px; transform: scale(0.228571); transform-origin: 0 0">
<dc-import name="AuthorHub" hint-size="5600px,1500px"></dc-import>
</div>
<div aria-hidden="true" class="slide" style="position: absolute; top: 0; height: 339px; width: 289px; border: 2px solid #D4D4D4; left: {{frameLeft}}px; transition: left 400ms ease"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px">
<span style="color: #9D9D9D">the window</span>
<span style="display: flex; align-items: center; gap: 24px">
<button type="button" onClick="{{back}}" disabled="{{atStart}}" style="min-height: 44px; padding: 0; background: transparent; color: #D4D4D4; border: 0; font: inherit; text-decoration: underline; text-underline-offset: 3px">back</button>
<span style="color: #9D9D9D">{{position}}</span>
<button type="button" onClick="{{next}}" disabled="{{atEnd}}" style="min-height: 44px; padding: 0; background: transparent; color: #D4D4D4; border: 0; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">next</button>
</span>
</div>
<div style="position: relative; width: 1280px; height: 1000px; overflow: hidden; background: #1E1E1E; outline: 1px solid #4A4A4A">
<header style="padding: 24px 64px 0; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 40px">
<span style="font-size: 20px"><span style="font-weight: 600">sungma</span> <span style="font-weight: 300">author</span></span>
<nav aria-label="Pages" style="display: flex; gap: 28px; font-size: 20px; font-weight: 300">
<sc-for list="{{stops}}" as="stop" hint-placeholder-count="5">
<button type="button" onClick="{{stop.go}}" aria-current="{{stop.current}}" style="min-height: 44px; padding: 0; background: transparent; border: 0; font: inherit; color: {{stop.color}}; font-weight: {{stop.weight}}">{{stop.name}}</button>
</sc-for>
</nav>
<span style="margin-left: auto; display: flex; align-items: center; gap: 28px">
<form role="search" class="search" style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#D4D4D4" stroke-width="1.6" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5"></circle><path d="M11.5 11.5L16 16"></path></svg>
<label for="aq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search author</label>
<input id="aq" type="search" placeholder="search subjects, subjectsets, namespaces" style="width: 300px; min-height: 40px; box-sizing: border-box; padding: 0; background: transparent; color: #D4D4D4; border: 0; border-radius: 0; font: inherit">
</form>
<a href="MonitorPanorama.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #D4D4D4; text-decoration-thickness: 1px; text-underline-offset: 3px">open monitoring</a>
<button type="button" aria-haspopup="menu" aria-expanded="false" style="min-height: 44px; padding: 0; background: transparent; color: #D4D4D4; border: 0; font: inherit">mark</button>
</span>
</header>
<div style="height: 924px; overflow: hidden">
<div class="slide" style="width: 5600px; transform: translateX(-{{offset}}px); transition: transform 400ms ease">
<dc-import name="AuthorHub" strip-height="{{windowHeight}}" on-go="{{goTo}}" hint-size="5600px,924px"></dc-import>
</div>
</div>
<sc-if value="{{hasPrev}}" hint-placeholder-val="{{ false }}">
<button type="button" class="edge" onClick="{{back}}" aria-label="{{prevLabel}}" style="position: absolute; left: 0; top: 76px; bottom: 0; width: 64px; padding: 0; background: transparent; border: 0; cursor: pointer"><span class="bar" style="position: absolute; left: 0; top: 0; bottom: 0; width: 48px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); color: #D4D4D4"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 3L6 10l7 7"></path></svg></span></button>
</sc-if>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
<button type="button" class="edge" onClick="{{next}}" aria-label="{{nextLabel}}" style="position: absolute; right: 0; top: 76px; bottom: 0; width: 160px; padding: 0; background: transparent; border: 0; cursor: pointer"><span class="bar" style="position: absolute; right: 0; top: 0; bottom: 0; width: 48px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); color: #D4D4D4"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3l7 7-7 7"></path></svg></span></button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1620}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
let at = 0;
try {
const names = ['start', 'subjectsets', 'subjects', 'namespaces', 'help'];
const i = names.indexOf((window.location.hash || '').slice(1));
if (i > 0) at = i;
} catch (e) {}
this.state = { at };
}
renderVals() {
const names = ['start', 'subjectsets', 'subjects', 'namespaces', 'help'];
const at = this.state.at;
const go = (i) => () => this.setState({ at: Math.max(0, Math.min(names.length - 1, i)) });
return {
offset: at * 1120,
windowHeight: 924,
frameLeft: at * 1120 * 0.228571,
position: (at + 1) + ' of ' + names.length + ': ' + names[at],
atStart: at === 0,
atEnd: at === names.length - 1,
hasPrev: at > 0,
hasNext: at < names.length - 1,
prevLabel: at > 0 ? 'Previous page: ' + names[at - 1] : '',
nextLabel: at < names.length - 1 ? 'Next page: ' + names[at + 1] : '',
goTo: (name) => { const i = names.indexOf(name); if (i >= 0) go(i)(); },
back: go(at - 1),
next: go(at + 1),
stops: names.map((name, i) => ({
name,
go: go(i),
current: i === at ? 'page' : 'false',
color: i === at ? '#D4D4D4' : '#9D9D9D',
weight: i === at ? '600' : '300',
})),
};
}
}
</script>
</body>
</html>
